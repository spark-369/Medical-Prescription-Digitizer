name: medical-prescription-digitizer

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mpd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpd}
      POSTGRES_DB: ${POSTGRES_DB:-mpd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpd} -d ${POSTGRES_DB:-mpd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mpd:mpd@postgres:5432/mpd}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg://mpd:mpd@postgres:5432/mpd}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      MIN_UPLOAD_SIZE_KB: ${MIN_UPLOAD_SIZE_KB:-10}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M}
      CREATE_ALL_TABLES: ${CREATE_ALL_TABLES:-true}
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=INFO --pool=solo
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mpd:mpd@postgres:5432/mpd}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg://mpd:mpd@postgres:5432/mpd}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M}
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    command: sh -c "npm run dev -- --hostname 0.0.0.0"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_URL_INTERNAL: ${API_URL_INTERNAL:-http://backend:8000}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  uploads_data:
  frontend_node_modules:
  frontend_next_cache: